name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: wb_bidder_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_USER: wb_bidder
        options: >-
          --health-cmd "pg_isready -U wb_bidder -d wb_bidder_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://wb_bidder:test-only-password@localhost:5432/wb_bidder_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run quality
      - run: pnpm prisma migrate deploy
      - run: pnpm run test:integration
      - run: pnpm run test:e2e
      - run: pnpm run test:load
      - run: pnpm run test:runbook
      - run: pnpm run build
      - run: pnpm run smoke:built
      - run: pnpm run docs:check
      - run: pnpm run security:secrets
      - run: pnpm run security:container
      - run: docker compose config
      - run: docker compose -f docker-compose.mock.yml config
      - run: docker compose -f docker-compose.mock-only.yml config
      - run: docker build --file Dockerfile --tag wb-bidder:${{ github.sha }} .
      - run: docker build --file Dockerfile.mock --tag wb-mock:${{ github.sha }} .
      - run: pnpm run smoke:compose
      - name: Scan bidder image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: wb-bidder:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan mock image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: wb-mock:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high --prod
      - run: pnpm run security:secrets
