name: wb-bidder

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wb_bidder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_USER: wb_bidder
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wb_bidder -d wb_bidder']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ['pnpm', 'run', 'prisma:migrate:deploy']
    environment:
      DATABASE_URL: postgresql://wb_bidder:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/wb_bidder
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  bidder:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ACCOUNT_CURRENCY: ${ACCOUNT_CURRENCY:-RUB}
      ACCOUNT_TIMEZONE: ${ACCOUNT_TIMEZONE:-Europe/Moscow}
      ADMIN_API_SERVICE_TOKEN: ${ADMIN_API_SERVICE_TOKEN:-replace-with-at-least-32-characters}
      DATABASE_URL: postgresql://wb_bidder:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/wb_bidder
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      PORT: 3000
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      CURRENT_STATE_SYNC_CRON: ${CURRENT_STATE_SYNC_CRON:-5 */15 * * * *}
      CURRENT_STATE_SYNC_RUN_DEADLINE_MS: ${CURRENT_STATE_SYNC_RUN_DEADLINE_MS:-600000}
      CURRENT_STATE_TARGET_SYNC_SLA_MINUTES: ${CURRENT_STATE_TARGET_SYNC_SLA_MINUTES:-20}
      CURRENT_BID_FRESHNESS_MINUTES: ${CURRENT_BID_FRESHNESS_MINUTES:-20}
      DATA_SYNC_CRON: ${DATA_SYNC_CRON:-25 */30 * * * *}
      DECISION_CRON: ${DECISION_CRON:-45 */30 * * * *}
      CAMPAIGN_APPLY_CRON: ${CAMPAIGN_APPLY_CRON:-*/10 * * * * *}
      VERIFICATION_POLL_INTERVAL_MS: ${VERIFICATION_POLL_INTERVAL_MS:-30000}
      RECONCILIATION_CRON: ${RECONCILIATION_CRON:-15 * * * * *}
      BID_VERIFICATION_INITIAL_DELAY_MS: ${BID_VERIFICATION_INITIAL_DELAY_MS:-30000}
      BID_VERIFICATION_TIMEOUT_MS: ${BID_VERIFICATION_TIMEOUT_MS:-600000}
      RECONCILIATION_STABLE_OLD_STATE_READS: ${RECONCILIATION_STABLE_OLD_STATE_READS:-2}
      RECONCILIATION_STABLE_READ_INTERVAL_MS: ${RECONCILIATION_STABLE_READ_INTERVAL_MS:-30000}
      RECONCILIATION_MAX_WRITE_ATTEMPTS: ${RECONCILIATION_MAX_WRITE_ATTEMPTS:-2}
      WB_WRITE_PRE_BYTE_MAX_RETRIES: ${WB_WRITE_PRE_BYTE_MAX_RETRIES:-1}
      PRE_WRITE_STATE_MAX_AGE_MS: ${PRE_WRITE_STATE_MAX_AGE_MS:-10000}
      MAX_DECISION_AGE_MINUTES: ${MAX_DECISION_AGE_MINUTES:-60}
      WB_WRITE_ATTEMPT_RETENTION_DAYS: ${WB_WRITE_ATTEMPT_RETENTION_DAYS:-30}
      MINIMUM_BID_TARGET_SYNC_SLA_MINUTES: ${MINIMUM_BID_TARGET_SYNC_SLA_MINUTES:-720}
      MINIMUM_BID_FRESHNESS_MINUTES: ${MINIMUM_BID_FRESHNESS_MINUTES:-720}
      SYNC_PAGE_SIZE: ${SYNC_PAGE_SIZE:-500}
      BID_STATE_MAX_OBSERVATION_GAP_MINUTES: ${BID_STATE_MAX_OBSERVATION_GAP_MINUTES:-20}
      DAY_FINALIZATION_MIN_STABLE_READS: ${DAY_FINALIZATION_MIN_STABLE_READS:-2}
      DAY_FINALIZATION_MIN_STABLE_MINUTES: ${DAY_FINALIZATION_MIN_STABLE_MINUTES:-60}
      CONVERSION_LAG_DAYS: ${CONVERSION_LAG_DAYS:-1}
      EXTERNAL_WRITE_CONTROL_MODE: ${EXTERNAL_WRITE_CONTROL_MODE:-SHARED}
      WB_API_MODE: ${WB_API_MODE:-prod}
      WB_API_PROD_BASE_URL: https://advert-api.wildberries.ru
      WB_API_TOKEN: ${WB_API_TOKEN:-missing-token}
      WB_API_CONNECT_TIMEOUT_MS: ${WB_API_CONNECT_TIMEOUT_MS:-2000}
      WB_API_TIMEOUT_MS: ${WB_API_TIMEOUT_MS:-15000}
      WB_API_GLOBAL_RATE_LIMIT_REQUESTS: ${WB_API_GLOBAL_RATE_LIMIT_REQUESTS:-5}
      WB_API_GLOBAL_RATE_LIMIT_INTERVAL_MS: ${WB_API_GLOBAL_RATE_LIMIT_INTERVAL_MS:-1000}
      WB_API_GLOBAL_RATE_LIMIT_BURST: ${WB_API_GLOBAL_RATE_LIMIT_BURST:-5}
      WB_API_RATE_LIMITS_JSON: ${WB_API_RATE_LIMITS_JSON:-{}}
      WB_API_MAX_IN_FLIGHT: ${WB_API_MAX_IN_FLIGHT:-5}
      WB_READ_MAX_ATTEMPTS: ${WB_READ_MAX_ATTEMPTS:-3}
      WB_READ_RETRY_BASE_MS: ${WB_READ_RETRY_BASE_MS:-250}
      WB_READ_RETRY_CAP_MS: ${WB_READ_RETRY_CAP_MS:-5000}
      WB_VERIFY_HTTP_MAX_ATTEMPTS: ${WB_VERIFY_HTTP_MAX_ATTEMPTS:-2}
      WB_TOKEN_EXPIRY_WARN_DAYS: ${WB_TOKEN_EXPIRY_WARN_DAYS:-14}
      WB_API_WRITE_ENABLED: ${WB_API_WRITE_ENABLED:-false}
      WB_ENDPOINT_PROFILE_VERSION: wb-promotion-2026-07-28-v1
      WB_EXPECTED_TOKEN_TYPE: ${WB_EXPECTED_TOKEN_TYPE:-PERSONAL}
      WB_PRODUCTION_WRITE_CONFIRMATION: ${WB_PRODUCTION_WRITE_CONFIRMATION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    ports:
      - '${BIDDER_PORT:-3000}:3000'
    restart: unless-stopped

volumes:
  postgres_data:
