name: wb-bidder-mock

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wb_bidder
      POSTGRES_PASSWORD: mock-postgres-password
      POSTGRES_USER: wb_bidder
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wb_bidder -d wb_bidder']
      interval: 2s
      timeout: 2s
      retries: 30

  wb-mock:
    build:
      context: .
      dockerfile: Dockerfile.mock
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOCK_CLOCK_MODE: virtual
      MOCK_INITIAL_TIME: ${MOCK_INITIAL_TIME:-2026-07-28T00:00:00.000Z}
      MOCK_SEED: ${MOCK_SEED:-foundation}
      PORT: 3001
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - '${WB_MOCK_PORT:-3001}:3001'

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ['pnpm', 'run', 'prisma:migrate:deploy']
    environment:
      DATABASE_URL: postgresql://wb_bidder:mock-postgres-password@postgres:5432/wb_bidder
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  bidder:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ACCOUNT_CURRENCY: RUB
      ACCOUNT_TIMEZONE: Europe/Moscow
      ADMIN_API_SERVICE_TOKEN: mock-admin-service-token-at-least-32-chars
      DATABASE_URL: postgresql://wb_bidder:mock-postgres-password@postgres:5432/wb_bidder
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: 'true'
      PORT: 3000
      SCHEDULER_ENABLED: 'true'
      WB_API_MOCK_BASE_URL: http://wb-mock:3001
      WB_API_MODE: mock
      WB_API_TOKEN: synthetic-test-token
      WB_API_WRITE_ENABLED: 'true'
      WB_ENDPOINT_PROFILE_VERSION: wb-promotion-2026-07-28-v1
      WB_EXPECTED_TOKEN_TYPE: TEST
    depends_on:
      migrate:
        condition: service_completed_successfully
      wb-mock:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '${BIDDER_PORT:-3000}:3000'
